services:
  backend:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/cyberrange.db
      ARENA_PROVIDER: remote
      ARENA_URL: ${ARENA_URL:-}
      ARENA_TOKEN: ${ARENA_TOKEN:-}
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

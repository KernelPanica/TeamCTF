[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberrange"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic>=2.9,<3", "PyYAML>=6,<7", "httpx>=0.27,<1"]

[project.scripts]
cyberrange = "portal.app.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "setuptools>=69", "wheel"]
browser = ["playwright>=1.45,<2"]

[tool.setuptools.packages.find]
include = ["portal*", "arena*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
